<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNO! - Online Multiplayer</title>
    <link rel="icon" href=">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="logo.jpg" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white font-['Poppins'] min-h-screen flex flex-col items-center justify-center p-4">

    <!-- লবি / রুম সেকশন -->
    <div id="lobby-screen" class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-2xl text-center border border-slate-700">
        <h1 class="text-4xl font-extrabold text-red-500 mb-2 tracking-wider">UNO! ONLINE</h1>
        <p class="text-slate-400 mb-6">বন্ধুদের সাথে আলাদা ডিভাইস থেকে খেলুন</p>
        
        <input type="text" id="player-name" placeholder="আপনার নাম লিখুন..." class="w-full px-4 py-3 mb-4 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-red-500 text-white">
        
        <div class="space-y-4">
            <button id="create-room-btn" class="w-full bg-red-600 hover:bg-red-700 font-semibold py-3 rounded-xl transition duration-200 shadow-lg">নতুন গেম শুরু করুন (Create Room)</button>
            
            <div class="border-t border-slate-700 pt-4">
                <p class="text-sm text-slate-400 mb-2">অথবা বন্ধুর কোড দিয়ে জয়েন করুন</p>
                <div class="flex gap-2">
                    <input type="text" id="room-code-input" placeholder="রুম কোড দিন" class="flex-1 px-4 py-2 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-blue-500 text-white uppercase">
                    <button id="join-room-btn" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-xl font-semibold transition duration-200">Join Game</button>
                </div>
            </div>
        </div>
    </div>

    <!-- গেম রুম সেকশন -->
    <div id="game-screen" class="hidden w-full max-w-4xl bg-slate-800 p-6 rounded-2xl shadow-2xl border border-slate-700 flex flex-col justify-between min-h-[600px]">
        <!-- রুম হেডার -->
        <div class="flex flex-wrap justify-between items-center border-b border-slate-700 pb-4 mb-4 gap-2">
            <div>
                <span class="text-slate-400">রুম কোড:</span> 
                <strong id="display-room-code" class="text-yellow-400 bg-slate-900 px-3 py-1 rounded-lg border border-slate-700 select-all cursor-pointer"></strong>
                <span class="text-xs text-slate-400 ml-1">(বন্ধুকে দিন)</span>
            </div>
            <div id="room-status" class="text-sm bg-yellow-500/10 text-yellow-400 px-3 py-1 rounded-full border border-yellow-500/20">খেলোয়াড়দের অপেক্ষা করা হচ্ছে...</div>
            <button id="start-game-btn" class="hidden bg-green-600 hover:bg-green-700 px-4 py-2 rounded-xl font-semibold text-sm shadow-lg">খেলা শুরু করুন</button>
        </div>

        <!-- খেলার টেবিল ও খেলোয়াড় লিস্ট -->
        <div class="flex-1 flex flex-col items-center justify-center relative my-8">
            <!-- রুমে থাকা সকল খেলোয়াড় -->
            <div class="mb-4 text-center">
                <p class="text-xs text-slate-400 mb-2">রুমে সংযুক্ত খেলোয়াড়গণ:</p>
                <div id="players-list" class="flex flex-wrap gap-2 justify-center"></div>
            </div>

            <!-- ডেক এবং ডিসকার্ড পাইল -->
            <div class="flex items-center gap-8 my-auto">
                <div id="draw-pile" class="w-24 h-36 bg-red-600 rounded-xl border-4 border-white shadow-xl flex items-center justify-center cursor-pointer hover:scale-105 transition transform">
                    <span class="text-xl font-bold tracking-widest text-center">UNO<br>Deck</span>
                </div>
                <div id="discard-pile" class="w-24 h-36 bg-slate-700 rounded-xl border-4 border-white shadow-xl flex items-center justify-center">
                    <span class="text-slate-400 text-xs text-center">ডিসকার্ড পাইল</span>
                </div>
            </div>

            <div id="turn-indicator" class="mt-4 text-lg font-semibold text-blue-400"></div>
        </div>

        <!-- প্লেয়ারের নিজের হাত (Cards) -->
        <div class="border-t border-slate-700 pt-4">
            <div class="text-sm text-slate-400 mb-2">আপনার কার্ডসমূহ:</div>
            <div id="player-hand" class="flex gap-3 overflow-x-auto py-2 min-h-[150px] items-center"></div>
        </div>
    </div>

    <!-- গেম ওভার / লিজার এনাউন্সমেন্ট মোডাল -->
    <div id="game-over-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 p-8 rounded-2xl border border-slate-700 text-center max-w-md w-full shadow-2xl">
            <h2 class="text-3xl font-bold text-red-500 mb-2">খেলা শেষ! 🏁</h2>
            <p class="text-slate-300 mb-6 text-lg">এই খেলায় হেরে গেছেন:</p>
            <div id="loser-name-display" class="text-2xl font-extrabold text-yellow-400 bg-slate-900 py-3 rounded-xl border border-slate-700 mb-6"></div>
            <button onclick="location.reload()" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-xl font-semibold transition">আবার খেলুন</button>
        </div>
    </div>

    <!-- গেম লজিক স্ক্রিপ্ট -->
    <script type="module" src="app.js"></script>
</body>
</html>
